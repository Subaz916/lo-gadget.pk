<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="hero-favicon.png">
  <title>Shop — LOGADGET.PK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="announcement" hidden></div>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <h1 id="page-title">All products</h1>
        <p id="page-sub">Browse the full LOGADGET.PK catalogue.</p>
      </div>

      <div class="toolbar">
        <div class="grow search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input class="input" id="search" type="search" placeholder="Search by name, brand or keyword..." autocomplete="off">
        </div>
        <select class="select" id="sort" style="width:auto;min-width:190px">
          <option value="new">Newest first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name: A to Z</option>
          <option value="featured">Featured first</option>
        </select>
        <label class="badge-pill" style="cursor:pointer">
          <input type="checkbox" id="in-stock" style="accent-color:var(--accent)"> In stock only
        </label>
      </div>

      <div class="chips" id="cat-chips" style="padding-bottom:18px"></div>

      <div class="result-bar">
        <span id="result-count">Loading products...</span>
        <button class="btn btn-ghost btn-sm" id="clear-filters" hidden>Clear filters</button>
      </div>

      <div class="p-grid" id="grid" style="padding-bottom:70px">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/products.js"></script>
</body>
</html>
