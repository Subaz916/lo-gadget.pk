<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — LOGADGET.PK Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="admin">
  <div class="admin-layout" id="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="topbar" id="topbar"></header>
      <div class="admin-content">
        <div class="stat-grid" id="stats">
          <div class="stat-card"><div class="sk" style="height:90px"></div></div>
          <div class="stat-card"><div class="sk" style="height:90px"></div></div>
          <div class="stat-card"><div class="sk" style="height:90px"></div></div>
          <div class="stat-card"><div class="sk" style="height:90px"></div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px" class="dash-grid">
          <div class="panel">
            <div class="panel-head"><h3>Orders by status</h3></div>
            <div class="bar-list" id="status-bars"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>Low stock alerts</h3><a class="btn btn-ghost btn-sm" href="products.html">Manage</a></div>
            <div id="low-stock"></div>
          </div>
        </div>

        <div class="panel-head"><h2>Recent orders</h2><a class="btn btn-ghost btn-sm" href="orders.html">View all</a></div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr><th>Order</th><th>Customer</th><th>Date</th><th>Status</th><th class="num">Total</th></tr>
            </thead>
            <tbody id="recent-orders"><tr><td colspan="5"><div class="sk" style="height:40px"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
